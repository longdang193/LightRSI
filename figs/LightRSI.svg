      </g>
      <g transform="translate(32 256)">
        <rect width="326" height="70" rx="7" fill="#FFF5DE" stroke="#D7AE55" stroke-dasharray="7 6"/>
        <circle cx="38" cy="35" r="16" fill="#D59A24"/>

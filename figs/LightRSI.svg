<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1529 835" role="img" aria-labelledby="title desc">
  <title id="title">LightRSI platform architecture</title>
  <desc id="desc">A modular runtime connecting recursive improvement capabilities to OpenClaw, Codex, and Claude Code.</desc>
